<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PhishLens{% endblock %}</title>
<meta name="description" content="PhishLens checks your domain's email security posture and shows you exactly what to fix.">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
</head>
<body>
<header class="nav">
  <a class="brand" href="/"><span class="brand-mark">◈</span> PhishLens</a>
  <nav>
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Scan</a>
    <a href="/help" class="{% if request.url.path == '/help' %}active{% endif %}">Help</a>
    {% if user %}
      <a href="/dashboard" class="{% if request.url.path == '/dashboard' %}active{% endif %}">Dashboard</a>
      <a href="#" id="logout">Log out</a>
    {% else %}
      <a href="/login">Log in</a>
      <a class="btn" href="/signup" style="padding:9px 18px;font-size:14px">Get started</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <p>
    <a href="/help">Help</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/api/health">Status</a>
  </p>
  <p>PhishLens — know where your domain stands.</p>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
