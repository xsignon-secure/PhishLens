<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report phishing</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; color: #14213d; background: #fff; }
  h1 { font-size: 16px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  p { margin: 0 0 12px; color: #4a5872; }
  button { font: inherit; font-weight: 600; color: #fff; background: #1f5bd8; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; width: 100%; }
  button:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; }
  .ok { display: block; background: #e7f7ee; color: #116b3a; }
  .bad { display: block; background: #fdecec; color: #a61b1b; }
  @media (prefers-color-scheme: dark) { body { background: #1b1f2a; color: #e8ecf4; } p { color: #a9b4c8; } }
</style>
</head>
<body>
<h1><img src="/addins/icon-32.png" width="20" height="20" alt="">Report phishing</h1>
<p>Think this email is a scam or phishing? Send it to your security team. They check the sender and the links; the message text isn't kept.</p>
<button id="go" disabled>Report this email</button>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
const btn = document.getElementById('go');
const msg = document.getElementById('msg');
function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'bad'); }
const VERDICTS = {'dangerous': 'Dangerous', 'likely phishing': 'Likely phishing', 'suspicious': 'Suspicious', 'clean': 'No obvious problems'};

function asEml(item) {
  // Whole message as .eml where the mailbox supports it (requirement set 1.14).
  return new Promise((resolve, reject) => {
    if (item.getAsFileAsync) {
      item.getAsFileAsync(r => r.status === Office.AsyncResultStatus.Succeeded
        ? resolve(Uint8Array.from(atob(r.value), c => c.charCodeAt(0))) : fallback(item).then(resolve, reject));
    } else fallback(item).then(resolve, reject);
  });
}
function fallback(item) {
  // Older Outlook: the internet headers plus the HTML body.
  return new Promise((resolve, reject) => {
    if (!item.getAllInternetHeadersAsync) return reject(new Error('This version of Outlook can\'t share the email. Forward it to your IT team instead.'));
    item.getAllInternetHeadersAsync(h => {
      if (h.status !== Office.AsyncResultStatus.Succeeded) return reject(new Error('Could not read the email.'));
      item.body.getAsync(Office.CoercionType.Html, b => {
        const headers = h.value.split(/\r?\n(?=\S)/).filter(l => !/^(content-type|content-transfer-encoding|mime-version):/i.test(l)).join('\r\n');
        const body = b.status === Office.AsyncResultStatus.Succeeded ? b.value : '';
        resolve(new TextEncoder().encode(headers.trim() + '\r\nMIME-Version: 1.0\r\nContent-Type: text/html; charset=utf-8\r\n\r\n' + body));
      });
    });
  });
}

Office.onReady(() => {
  if (!token) { show('This add-in is missing its company key. Ask your IT team to reinstall it.', false); return; }
  btn.disabled = false;
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const item = Office.context.mailbox.item;
      const eml = await asEml(item);
      const r = await fetch('/api/report-button/report', {method: 'POST', credentials: 'omit',
        headers: {'Content-Type': 'message/rfc822', 'X-Report-Token': token,
                  'X-Reporter': (Office.context.mailbox.userProfile || {}).emailAddress || ''}, body: eml});
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.detail || ('HTTP ' + r.status));
      show('Thanks, your security team has it. First check: ' + (VERDICTS[d.verdict] || d.verdict) + '.', true);
      btn.textContent = 'Reported';
    } catch (err) {
      show('Could not send the report: ' + err.message, false);
      btn.disabled = false; btn.textContent = 'Try again';
    }
  };
});
</script>
</body>
</html>
