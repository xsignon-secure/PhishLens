{% extends "base.html" %}
{% block title %}Set new password — PhishLens{% endblock %}
{% block content %}
<section class="auth">
  <h1>Set a new password</h1>
  <form id="reset-form">
    <label>New password (8+ characters)<input name="password" type="password" required minlength="8"></label>
    <button class="btn big" type="submit">Set password</button>
    <p id="reset-err" class="error"></p>
  </form>
  <p id="reset-ok" class="hidden">✓ Password updated. <a href="/login">Log in</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = new URLSearchParams(location.search).get('token');
  const fd = new FormData(e.target);
  const r = await fetch('/api/auth/password/reset', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token, new_password: fd.get('password')})});
  if (r.ok) {
    document.getElementById('reset-form').classList.add('hidden');
    document.getElementById('reset-ok').classList.remove('hidden');
  } else {
    document.getElementById('reset-err').textContent = 'This link is invalid or expired.';
  }
});
</script>
{% endblock %}
