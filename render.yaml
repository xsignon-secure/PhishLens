# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the web app and a Postgres database, and wires them together.
services:
  - type: web
    name: phishlens
    runtime: docker
    plan: free            # free instances sleep after ~15 min idle; see docs/DEPLOY-RENDER.md
    region: oregon        # must match the database region below
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a long random value
      - key: ADMIN_PASSWORD
        sync: false                  # the dashboard password; Render asks during setup
      - key: ADMIN_EMAIL
        sync: false                  # where alert and report emails go (optional)
      - key: DATABASE_URL
        fromDatabase:
          name: phishlens-db
          property: connectionString
      - key: VIRUSTOTAL_API_KEY
        sync: false                  # Render asks you for this during setup
      - key: RESCAN_INTERVAL_HOURS
        value: "168"                 # built-in weekly rescans, no paid cron job
      # APP_URL defaults to the service's https://<name>.onrender.com address.
      # Set APP_URL (and SMTP_* for email alerts) in the dashboard when you
      # add a custom domain or an email provider.


databases:
  - name: phishlens-db
    plan: free            # free Render Postgres expires after a trial; Neon/Supabase free Postgres don't
    region: oregon
    databaseName: phishlens
    user: phishlens
