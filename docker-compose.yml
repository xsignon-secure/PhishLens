# One-command self-hosting:
#   SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))") docker compose up -d
# Then open http://localhost:8000. Data lives in the "pgdata" volume.
services:
  app:
    build: .
    # Or use the prebuilt image instead of building:
    # image: ghcr.io/xsignon-secure/phishlens:latest
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to a long random string}
      DATABASE_URL: postgresql+psycopg://phishlens:phishlens@db:5432/phishlens
      APP_URL: ${APP_URL:-http://localhost:8000}
      RESCAN_INTERVAL_HOURS: ${RESCAN_INTERVAL_HOURS:-168}
      REPORT_FETCH_MINUTES: ${REPORT_FETCH_MINUTES:-0}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phishlens
      POSTGRES_PASSWORD: phishlens
      POSTGRES_DB: phishlens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishlens"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
